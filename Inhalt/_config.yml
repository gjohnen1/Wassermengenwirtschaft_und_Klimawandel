# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Wasserwirtschaft und Klimawandel
author: Dan Kovacek & Gregor Johnen (German adaptation and translation)
logo: img/logo_claim_en_rgb_72dpi.png

exclude_patterns:
  - "simple_reservoir/**"
  - "**/.ipynb_checkpoints/**"
  - "_build/**"

# Notebooks are cached: only re-executed when the source changes.
# See https://jupyterbook.org/content/execute.html
# Use `jupyter-book build --all Inhalt/` to force a full rebuild.
execute:
  execute_notebooks: cache
  exclude_patterns:
    - "simple_reservoir/**"
    - "**/.ipynb_checkpoints/**"
  # rtc-tools subprocess calls + plotly figure rendering can exceed the
  # default 30 s per-cell timeout, especially on cold starts.
  timeout: 120

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
#bibtex_bibfiles:
#  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/gjohnen1/Wassermengenwirtschaft_und_Klimawandel  # Online location of your book
  path_to_book: Inhalt  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  navbar_number_sections: true  # Number sections in navigation
  sidebar:
    collapse_level: 1  # Control sidebar collapse level

# Sphinx-level configuration
sphinx:
  config:
    # Bokeh emits 'application/vnd.bokehjs_load.v0+json' / '..._exec.v0+json'
    # alongside text/html for every figure. myst-nb correctly renders the HTML
    # but emits a warning per unknown MIME type. Suppress the noise — these
    # MIMEs are internal trigger signals and don't carry visible content.
    suppress_warnings:
      - mystnb.unknown_mime_type

launch_buttons:
  binderhub_url: "https://mybinder.org"  # The URL for your BinderHub (e.g., https://mybinder.org)
  colab_url: "https://colab.research.google.com"